id: a1a1205c-d7e3-5d88-ab59-18ea92eec89e
name: Essential Eight Evidence - E8-POS-ML3-01 (ML3)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-POS-ML3-01 (Maturity Level 3 - Patch
  operating systems): Automated asset discovery runs at least fortnightly and operating system patches for workstations, servers
  and network devices are applied within two weeks of release, or 48 hours if critical or exploited. Reference: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicetvmsoftwarevulnerabilitieskb-table'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSoftwareVulnerabilities
  - DeviceTvmSoftwareVulnerabilitiesKB
  - DeviceInfo
tactics:
- InitialAccess
- PrivilegeEscalation
relevantTechniques:
- T1190
- T1068
tags:
- EssentialEight:patch-operating-systems
- MaturityLevel:ML3
- Requirement:E8-POS-ML3-01
- AssessmentEvidence
query: 'let kb = DeviceTvmSoftwareVulnerabilitiesKB

  | summarize arg_max(TimeGenerated, PublishedDate, IsExploitAvailable) by CveId;

  DeviceTvmSoftwareVulnerabilities

  | where TimeGenerated > ago(14d)

  | summarize arg_max(TimeGenerated, SoftwareName, VulnerabilitySeverityLevel, CveTags, RecommendedSecurityUpdate) by DeviceId,
  DeviceName, CveId

  | where SoftwareName has_any (''windows'', ''ubuntu'', ''rhel'', ''debian'', ''centos'', ''macos'', ''linux_kernel'', ''server'')

  | join kind=inner kb on CveId

  | extend AgeHours = datetime_diff(''hour'', now(), PublishedDate)

  | extend IsExploited = (IsExploitAvailable == true or tostring(CveTags) has_any (''ZeroDay'', ''ExploitInTheWild'', ''CISA_KEV''))

  | where ((IsExploited or VulnerabilitySeverityLevel == ''Critical'') and AgeHours > 48) or AgeHours > (14 * 24)

  | extend EvidenceRequirement = ''E8-POS-ML3-01''

  | project EvidenceRequirement, DeviceName, CveId, SoftwareName, VulnerabilitySeverityLevel, IsExploited, AgeDays = round(AgeHours
  / 24.0, 1), RecommendedSecurityUpdate

  | order by AgeDays desc'
version: 1.0.0
