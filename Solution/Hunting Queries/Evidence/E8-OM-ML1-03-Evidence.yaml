id: 24e6c80c-47ad-57ec-a2dc-cd1a6fec42d6
name: Essential Eight Evidence - E8-OM-ML1-03 (ML1)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-OM-ML1-03 (Maturity Level 1 - Configure
  Microsoft Office macro settings): Microsoft Office macro antivirus scanning is enabled and macro security settings cannot
  be changed by users. Reference: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSecureConfigurationAssessment
  - DeviceRegistryEvents
tactics:
- Execution
- InitialAccess
relevantTechniques:
- T1204.002
- T1566.001
tags:
- EssentialEight:configure-office-macros
- MaturityLevel:ML1
- Requirement:E8-OM-ML1-03
- AssessmentEvidence
query: 'DeviceTvmSecureConfigurationAssessment

  | where TimeGenerated > ago(14d)

  | where ConfigurationSubcategory has_any (''Office'', ''Macro'', ''Antivirus'')

  | summarize arg_max(TimeGenerated, IsApplicable, IsCompliant, ConfigurationSubcategory) by DeviceId, DeviceName, ConfigurationId

  | where IsApplicable == true

  | extend EvidenceRequirement = ''E8-OM-ML1-03''

  | summarize CompliantChecks = countif(IsCompliant == true), NonCompliantChecks = countif(IsCompliant == false) by EvidenceRequirement,
  DeviceName

  | order by NonCompliantChecks desc'
version: 1.0.0
