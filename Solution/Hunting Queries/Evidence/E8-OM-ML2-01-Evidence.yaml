id: d75bde24-a985-53e4-b35a-15d7c61415d0
name: Essential Eight Evidence - E8-OM-ML2-01 (ML2)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-OM-ML2-01 (Maturity Level 2 - Configure
  Microsoft Office macro settings): Microsoft Office macros are only allowed to execute from trusted locations with write
  access limited to administrators, or when digitally signed by a trusted publisher. Reference: https://learn.microsoft.com/en-us/microsoft-365-apps/security/macros-in-office'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSecureConfigurationAssessment
  - DeviceRegistryEvents
  - DeviceEvents
tactics:
- Execution
- InitialAccess
relevantTechniques:
- T1204.002
- T1566.001
tags:
- EssentialEight:configure-office-macros
- MaturityLevel:ML2
- Requirement:E8-OM-ML2-01
- AssessmentEvidence
query: 'DeviceRegistryEvents

  | where TimeGenerated > ago(14d)

  | where RegistryKey has ''\\Office\\'' and (RegistryValueName =~ ''vbawarnings'' or RegistryKey has ''Trusted Locations'')

  | summarize arg_max(TimeGenerated, RegistryValueData, ActionType) by DeviceName, RegistryKey, RegistryValueName

  | extend EvidenceRequirement = ''E8-OM-ML2-01''

  | project EvidenceRequirement, TimeGenerated, DeviceName, RegistryKey, RegistryValueName, RegistryValueData

  | order by TimeGenerated desc'
version: 1.0.0
