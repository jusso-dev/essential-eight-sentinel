id: de2aa6fd-102c-54c0-bf40-4bb0204a129e
name: Essential Eight Evidence - E8-PA-ML3-02 (ML3)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-PA-ML3-02 (Maturity Level 3 - Patch
  applications): Patches, updates or vendor mitigations for vulnerabilities in other applications are applied within two weeks
  of release, or within 48 hours if working exploits exist. Reference: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicetvmsoftwarevulnerabilitieskb-table'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSoftwareVulnerabilities
  - DeviceTvmSoftwareVulnerabilitiesKB
tactics:
- InitialAccess
- Execution
relevantTechniques:
- T1190
- T1203
tags:
- EssentialEight:patch-applications
- MaturityLevel:ML3
- Requirement:E8-PA-ML3-02
- AssessmentEvidence
query: 'let kb = DeviceTvmSoftwareVulnerabilitiesKB

  | summarize arg_max(TimeGenerated, PublishedDate, IsExploitAvailable) by CveId;

  DeviceTvmSoftwareVulnerabilities

  | where TimeGenerated > ago(14d)

  | summarize arg_max(TimeGenerated, SoftwareVendor, SoftwareName, SoftwareVersion, VulnerabilitySeverityLevel, CveTags, RecommendedSecurityUpdate)
  by DeviceId, DeviceName, CveId

  | where not(SoftwareName has_any (''windows'', ''ubuntu'', ''rhel'', ''debian'', ''centos'', ''macos'', ''linux_kernel'',
  ''server''))

  | join kind=inner kb on CveId

  | extend AgeHours = datetime_diff(''hour'', now(), PublishedDate)

  | extend IsExploited = (IsExploitAvailable == true or tostring(CveTags) has_any (''ZeroDay'', ''ExploitInTheWild'', ''CISA_KEV''))

  | where (IsExploited and AgeHours > 48) or AgeHours > (14 * 24)

  | extend EvidenceRequirement = ''E8-PA-ML3-02''

  | project EvidenceRequirement, DeviceName, CveId, SoftwareVendor, SoftwareName, SoftwareVersion, VulnerabilitySeverityLevel,
  IsExploited, AgeDays = round(AgeHours / 24.0, 1), RecommendedSecurityUpdate

  | order by AgeDays desc'
version: 1.0.0
