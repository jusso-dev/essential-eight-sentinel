id: 36894b9c-735c-55e1-b820-429d67076651
name: Essential Eight Evidence - E8-OM-ML1-02 (ML1)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-OM-ML1-02 (Maturity Level 1 - Configure
  Microsoft Office macro settings): Microsoft Office macros in files originating from the internet are blocked. Reference:
  https://learn.microsoft.com/en-us/microsoft-365-apps/security/internet-macros-blocked'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSecureConfigurationAssessment
  - DeviceRegistryEvents
  - DeviceEvents
tactics:
- Execution
- InitialAccess
relevantTechniques:
- T1204.002
- T1566.001
tags:
- EssentialEight:configure-office-macros
- MaturityLevel:ML1
- Requirement:E8-OM-ML1-02
- AssessmentEvidence
query: 'DeviceRegistryEvents

  | where TimeGenerated > ago(14d)

  | where RegistryKey has ''\\Office\\'' and RegistryValueName =~ ''blockcontentexecutionfrominternet''

  | summarize arg_max(TimeGenerated, RegistryValueData, ActionType) by DeviceName, RegistryKey, RegistryValueName

  | extend EvidenceRequirement = ''E8-OM-ML1-02''

  | extend Compliant = (RegistryValueData == ''1'')

  | project EvidenceRequirement, DeviceName, RegistryKey, RegistryValueName, RegistryValueData, Compliant

  | order by Compliant asc, DeviceName asc'
version: 1.0.0
