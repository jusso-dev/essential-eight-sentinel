id: da39f107-ead4-57db-9cab-9ec935dd6ac0
name: Essential Eight Evidence - E8-UAH-ML3-01 (ML3)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-UAH-ML3-01 (Maturity Level 3 - User
  application hardening): Hardened browser, Office, PDF and scripting configurations are centrally enforced and protected
  from user modification, with blocked hardening events monitored. Reference: https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceEvents
  - DeviceTvmSecureConfigurationAssessment
  - DeviceRegistryEvents
tactics:
- Execution
- DefenseEvasion
relevantTechniques:
- T1059
- T1218
tags:
- EssentialEight:user-application-hardening
- MaturityLevel:ML3
- Requirement:E8-UAH-ML3-01
- AssessmentEvidence
query: 'DeviceEvents

  | where TimeGenerated > ago(14d)

  | where ActionType startswith ''Asr''

  | extend Mode = iff(ActionType endswith ''Blocked'', ''Blocked'', iff(ActionType endswith ''Audited'', ''Audited'', ''Other''))

  | extend EvidenceRequirement = ''E8-UAH-ML3-01''

  | summarize EventCount = count(), Devices = dcount(DeviceId) by EvidenceRequirement, ActionType, Mode

  | order by Mode asc, EventCount desc'
version: 1.0.0
