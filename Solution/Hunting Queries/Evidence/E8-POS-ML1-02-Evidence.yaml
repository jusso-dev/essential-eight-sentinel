id: 90be0c8f-a0a1-500e-bbc6-05f4e5f43ad0
name: Essential Eight Evidence - E8-POS-ML1-02 (ML1)
description: 'Assessment evidence export query for ASD Essential Eight requirement E8-POS-ML1-02 (Maturity Level 1 - Patch
  operating systems): Patches, updates or vendor mitigations for vulnerabilities in operating systems of workstations, servers
  and network devices are applied within one month of release, or within 48 hours if an exploit exists. Reference: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicetvmsoftwarevulnerabilitieskb-table'
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceTvmSoftwareVulnerabilities
  - DeviceTvmSoftwareVulnerabilitiesKB
  - DeviceInfo
tactics:
- InitialAccess
- PrivilegeEscalation
relevantTechniques:
- T1190
- T1068
tags:
- EssentialEight:patch-operating-systems
- MaturityLevel:ML1
- Requirement:E8-POS-ML1-02
- AssessmentEvidence
query: 'let kb = DeviceTvmSoftwareVulnerabilitiesKB

  | summarize arg_max(TimeGenerated, PublishedDate, IsExploitAvailable) by CveId;

  DeviceTvmSoftwareVulnerabilities

  | where TimeGenerated > ago(14d)

  | summarize arg_max(TimeGenerated, SoftwareName, VulnerabilitySeverityLevel, CveTags, RecommendedSecurityUpdate) by DeviceId,
  DeviceName, CveId

  | where SoftwareName has_any (''windows'', ''ubuntu'', ''rhel'', ''debian'', ''centos'', ''macos'', ''linux_kernel'', ''server'')

  | join kind=inner kb on CveId

  | extend AgeHours = datetime_diff(''hour'', now(), PublishedDate)

  | extend IsExploited = (IsExploitAvailable == true or tostring(CveTags) has_any (''ZeroDay'', ''ExploitInTheWild'', ''CISA_KEV''))

  | where (IsExploited and AgeHours > 48) or AgeHours > (30 * 24)

  | extend EvidenceRequirement = ''E8-POS-ML1-02''

  | project EvidenceRequirement, DeviceName, CveId, SoftwareName, VulnerabilitySeverityLevel, IsExploited, AgeDays = round(AgeHours
  / 24.0, 1), RecommendedSecurityUpdate

  | order by AgeDays desc'
version: 1.0.0
