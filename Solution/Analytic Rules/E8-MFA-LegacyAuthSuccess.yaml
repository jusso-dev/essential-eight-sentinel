id: 5b1a8e3c-2d4f-4a7b-8c20-1e9f5a7b2c02
name: "Essential Eight - Successful Legacy Authentication Sign-In"
description: |
  Detects successful Microsoft Entra ID sign-ins using legacy authentication protocols (IMAP4, POP3,
  SMTP, Exchange ActiveSync, Exchange Web Services, Autodiscover, MAPI Over HTTP or Other clients)
  that bypass modern multi-factor authentication. Maps to ASD Essential Eight requirement E8-MFA-ML1-03.
  Reference: https://learn.microsoft.com/en-us/entra/identity/conditional-access/block-legacy-authentication
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
      - AADNonInteractiveUserSignInLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CredentialAccess
relevantTechniques:
  - T1078
  - T1110
tags:
  - EssentialEight:MultiFactorAuthentication
  - MaturityLevel:ML1
  - Requirement:E8-MFA-ML1-03
query: |
  union isfuzzy=true SigninLogs, AADNonInteractiveUserSignInLogs
  | where ResultType == '0'
  | where ClientAppUsed in~ (
      'IMAP4',
      'POP3',
      'SMTP',
      'Exchange ActiveSync',
      'Exchange Web Services',
      'Autodiscover',
      'MAPI Over HTTP',
      'Other clients'
  )
  | summarize SignInCount = count(), Apps = make_set(AppDisplayName, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by UserPrincipalName, IPAddress, ClientAppUsed
  | project TimeGenerated = LastSeen, UserPrincipalName, IPAddress, ClientAppUsed, SignInCount, Apps
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  ClientAppUsed: ClientAppUsed
  SignInCount: SignInCount
version: 1.0.0
kind: Scheduled
